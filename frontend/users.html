<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Users · Manufacturing QMS</title>
  <link rel="stylesheet" href="vendor/bootstrap.min.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

<header id="app-navbar"></header>

<main class="container-fluid px-4 py-4">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <h1 class="h4 mb-0">Users</h1>
      <p class="text-secondary small mb-0">Who may sign in, and what they are allowed to do.</p>
    </div>
    <button class="btn btn-primary" id="btn-new">+ Add User</button>
  </div>

  <div id="message"></div>

  <div class="card">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr><th>Username</th><th>Full name</th><th>Role</th><th>Status</th><th>Created</th><th class="text-end">Actions</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="card-footer bg-white" id="pager-footer"></div>
  </div>

</main>

<div class="modal fade" id="user-modal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="user-form" novalidate>
        <div class="modal-header">
          <h5 class="modal-title" id="user-modal-title">Add a user</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="form-message"></div>
          <div class="mb-3">
            <label class="form-label" for="u-username">Username <span class="text-danger">*</span></label>
            <input class="form-control" id="u-username" minlength="3" maxlength="50" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="u-password">Password</label>
            <input class="form-control" type="password" id="u-password" maxlength="72" autocomplete="new-password">
            <div class="form-text" id="u-password-help">At least 8 characters. Stored only as a BCrypt hash.</div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="u-fullname">Full name <span class="text-danger">*</span></label>
            <input class="form-control" id="u-fullname" minlength="3" maxlength="100" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="u-role">Role <span class="text-danger">*</span></label>
            <select class="form-select" id="u-role" required>
              <option value="ADMIN">Administrator</option>
              <option value="INSPECTOR">Quality Inspector</option>
              <option value="SUPERVISOR">Production Supervisor</option>
            </select>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="u-active" checked>
            <label class="form-check-label" for="u-active">Active &mdash; the account may sign in</label>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="btn-save">Save user</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="vendor/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script>
/* ---------------------------------------------------------------------------
   users.html — screen 3 of 10 (FR-02). Administrator only.
   Two deliberate rules are visible here:
     · a user is never deleted, only deactivated (FR-02.9), because the defect
       history refers to the people who raised and fixed things
     · you cannot deactivate your own account (FR-02.10), which would lock
       the last administrator out of the system
--------------------------------------------------------------------------- */
(async function () {

  const me = await Layout.boot();
  if (!me) return;

  // The navbar already hides Users from other roles; this stops a typed URL.
  if (me.role !== 'ADMIN') {
    Layout.showMessage('User management is available to Administrators only.', 'danger');
    document.getElementById('btn-new').classList.add('d-none');
    return;
  }

  const table = Layout.table('rows', 'pager-footer', 6);
  const modal = new bootstrap.Modal(document.getElementById('user-modal'));
  const form = document.getElementById('user-form');
  let editing = null;

  document.getElementById('btn-new').addEventListener('click', openCreate);
  document.getElementById('rows').addEventListener('click', onRowClick);
  form.addEventListener('submit', save);

  await load();

  async function load() {
    Layout.clearMessage();
    try {
      table.setRows((await API.get('/api/users')).map(row));
    } catch (error) { Layout.showError(error); }
  }

  function row(u) {
    const isMe = u.userId === me.userId;
    return '<tr class="' + (u.isActive ? '' : 'table-secondary') + '">' +
      '<td class="fw-semibold">' + Layout.esc(u.username) + (isMe ? ' <span class="badge text-bg-info">you</span>' : '') + '</td>' +
      '<td>' + Layout.esc(u.fullName) + '</td>' +
      '<td>' + Layout.roleLabel(u.role) + '</td>' +
      '<td>' + (u.isActive
        ? '<span class="badge text-bg-success">Active</span>'
        : '<span class="badge text-bg-secondary">Deactivated</span>') + '</td>' +
      '<td>' + Layout.date(u.createdAt) + '</td>' +
      '<td class="text-end"><div class="btn-group btn-group-sm">' +
        '<button class="btn btn-outline-secondary" data-edit="' + u.userId + '">Edit</button>' +
        (u.isActive
          ? '<button class="btn btn-outline-danger" data-deactivate="' + u.userId + '"' +
            (isMe ? ' disabled title="You cannot deactivate your own account"' : '') + '>Deactivate</button>'
          : '<button class="btn btn-outline-success" data-activate="' + u.userId + '">Activate</button>') +
      '</div></td></tr>';
  }

  async function onRowClick(event) {
    const edit = event.target.closest('[data-edit]');
    const deactivate = event.target.closest('[data-deactivate]');
    const activate = event.target.closest('[data-activate]');
    if (edit) openEdit(Number(edit.dataset.edit));
    if (deactivate) setActive(Number(deactivate.dataset.deactivate), false);
    if (activate) setActive(Number(activate.dataset.activate), true);
  }

  async function setActive(id, active) {
    if (!window.confirm(active ? 'Activate this account?' : 'Deactivate this account? The person will no longer be able to sign in.')) return;
    try {
      await API.put('/api/users/' + id + '/active/' + active);
      Layout.showMessage(active ? 'Account activated.' : 'Account deactivated.', 'success');
      await load();
    } catch (error) { Layout.showError(error); }
  }

  /* ---------- form ------------------------------------------------------- */
  async function openCreate() {
    editing = null;
    document.getElementById('user-modal-title').textContent = 'Add a user';
    document.getElementById('btn-save').textContent = 'Save user';
    document.getElementById('form-message').innerHTML = '';
    form.reset();
    document.getElementById('u-active').checked = true;
    document.getElementById('u-password').required = true;
    document.getElementById('u-password-help').textContent = 'At least 8 characters. Stored only as a BCrypt hash.';
    modal.show();
  }

  async function openEdit(id) {
    const users = await API.get('/api/users');
    const u = users.find(x => x.userId === id);
    if (!u) return;
    editing = u;
    document.getElementById('user-modal-title').textContent = 'Edit ' + u.username;
    document.getElementById('btn-save').textContent = 'Save changes';
    document.getElementById('form-message').innerHTML = '';
    document.getElementById('u-username').value = u.username;
    document.getElementById('u-fullname').value = u.fullName;
    document.getElementById('u-role').value = u.role;
    document.getElementById('u-active').checked = u.isActive;
    document.getElementById('u-password').value = '';
    document.getElementById('u-password').required = false;
    document.getElementById('u-password-help').textContent = 'Leave blank to keep the current password.';
    modal.show();
  }

  async function save(event) {
    event.preventDefault();
    if (!form.checkValidity()) { form.classList.add('was-validated'); return; }

    const body = {
      username: document.getElementById('u-username').value.trim(),
      password: document.getElementById('u-password').value || null,
      fullName: document.getElementById('u-fullname').value.trim(),
      role: document.getElementById('u-role').value,
      isActive: document.getElementById('u-active').checked
    };

    try {
      if (editing === null) await API.post('/api/users', body);
      else await API.put('/api/users/' + editing.userId, body);
      modal.hide();
      Layout.showMessage(editing === null ? 'User created.' : 'User updated.', 'success');
      await load();
    } catch (error) {
      document.getElementById('form-message').innerHTML =
        '<div class="alert alert-danger mb-3">' + Layout.esc(error.message) +
        (error.details && error.details.length ? '<ul class="mb-0 mt-1">' +
          error.details.map(x => '<li>' + Layout.esc(x) + '</li>').join('') + '</ul>' : '') + '</div>';
    }
  }

})();
</script>
</body>
</html>
